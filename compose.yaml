services:
  susmessagebot:
    image: ${IMAGE:-ghcr.io/theresaqaq/susmessagebot:latest}
    container_name: susmessagebot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      HEALTH_PORT: "8001"
      METRICS_PORT: "8000"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
