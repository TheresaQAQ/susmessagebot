name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      # HITL sync commits seeds via GitHub API; skip rebuild loops.
      - "susmessagebot/seeds.py"
      - "assets/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "eval_results/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "susmessagebot/seeds.py"
      - "assets/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "eval_results/**"

# Do not cancel in-progress runs: the deploy job SSHs to production and must
# finish (or roll back) instead of being interrupted by a newer push.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: susmessagebot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-vps.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-minilm-l6-v2-${{ runner.os }}-${{ hashFiles('requirements-vps.txt') }}
          restore-keys: |
            hf-all-minilm-l6-v2-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements-vps.txt

      - name: Syntax check
        run: python -m compileall -q susmessagebot scripts tests

      - name: Unit tests
        env:
          SILICONFLOW_API_KEY: ci-dummy
          DISCORD_BOT_TOKEN: ci-dummy
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          TAG="${{ github.sha }}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout deployment config
        uses: actions/checkout@v4

      - name: Encode runtime Compose
        id: compose
        run: echo "content=$(base64 -w0 compose.yaml)" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE,GHCR_USERNAME,GHCR_READ_TOKEN,COMPOSE_B64
          script: |
            set -euo pipefail

            APP_DIR="/opt/susmessagebot"
            COMPOSE_FILE="${APP_DIR}/compose.yaml"
            ENV_FILE="/opt/susmessagebot-secrets/.env"
            sudo mkdir -p "$APP_DIR"

            # Install runtime configuration sent by Actions. The VPS never
            # clones or pulls the source repository.
            printf '%s' "${COMPOSE_B64}" \
              | base64 --decode \
              | sudo tee "${COMPOSE_FILE}.tmp" >/dev/null
            sudo mv "${COMPOSE_FILE}.tmp" "$COMPOSE_FILE"
            sudo chmod 644 "$COMPOSE_FILE"

            if ! sudo test -f "$ENV_FILE"; then
              echo "Missing ${ENV_FILE}; create it on the VPS before deploying"
              exit 1
            fi

            # Stop legacy non-container process if still enabled.
            if systemctl is-active --quiet susmessagebot 2>/dev/null; then
              sudo systemctl stop susmessagebot || true
              sudo systemctl disable susmessagebot || true
            fi

            compose() {
              sudo env IMAGE="${IMAGE}" \
                docker compose -p susmessagebot -f "$COMPOSE_FILE" "$@"
            }

            wait_for_healthy() {
              local expected_image="$1"
              local phase="$2"
              local status
              local running_image

              echo "Waiting for ${phase} container health..."
              for i in $(seq 1 36); do
                status="$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' susmessagebot 2>/dev/null || echo missing)"
                running_image="$(sudo docker inspect -f '{{.Config.Image}}' susmessagebot 2>/dev/null || echo missing)"
                if [ "${status}" = "healthy" ] && [ "${running_image}" = "${expected_image}" ]; then
                  echo "${phase} healthy with ${expected_image}"
                  return 0
                fi
                if [ "${status}" = "healthy" ] && [ "${running_image}" != "${expected_image}" ]; then
                  echo "${phase} started unexpected image ${running_image}"
                  return 1
                fi
                if [ "${status}" = "unhealthy" ] || [ "${status}" = "exited" ] || [ "${status}" = "dead" ]; then
                  echo "${phase} container became ${status}"
                  return 1
                fi
                sleep 5
              done
              echo "${phase} container did not become healthy in time"
              return 1
            }

            PREVIOUS_IMAGE="$(sudo docker inspect -f '{{.Config.Image}}' susmessagebot 2>/dev/null || true)"

            echo "${GHCR_READ_TOKEN}" \
              | sudo docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            export IMAGE="${IMAGE}"
            if compose pull \
              && compose up -d --remove-orphans \
              && wait_for_healthy "${IMAGE}" "Deploy"; then
              sudo docker logout ghcr.io >/dev/null 2>&1 || true
              exit 0
            fi

            echo "Deploy failed; dumping logs"
            compose logs --tail=200 || true

            if [ -n "${PREVIOUS_IMAGE}" ] && [ "${PREVIOUS_IMAGE}" != "${IMAGE}" ]; then
              echo "Rolling back to ${PREVIOUS_IMAGE}"
              export IMAGE="${PREVIOUS_IMAGE}"
              if compose up -d --remove-orphans \
                && wait_for_healthy "${PREVIOUS_IMAGE}" "Rollback"; then
                echo "Rollback completed successfully"
              else
                echo "Rollback failed; production is not confirmed healthy"
                compose logs --tail=200 || true
              fi
            else
              echo "No distinct previous image is available for rollback"
            fi

            sudo docker logout ghcr.io >/dev/null 2>&1 || true
            exit 1
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          COMPOSE_B64: ${{ steps.compose.outputs.content }}
